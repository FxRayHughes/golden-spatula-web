services:
  s11-exalted:
    image: docker.maplex.top/s11-exalted:0.2.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8080"
    environment:
      ADMIN_USER: "${ADMIN_USER}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      TRUST_PROXY: "${TRUST_PROXY}"
    volumes:
      - ./data:/data
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
